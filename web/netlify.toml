# Usado quando a pasta web/ é arrastada direto no Netlify Drop
# (https://app.netlify.com/drop) — a pasta inteira vira a raiz do site.

[build]
  publish = "."

# O jogo não usa threads (SharedArrayBuffer), então não precisa dos headers
# COOP/COEP que complicam o deploy.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pck"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vídeos da intro: nomes FIXOS (intro-1/2) → sempre revalidar (regra do projeto
# para nomes que não mudam; immutable só para bundles versionados crystalia-vN).
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
