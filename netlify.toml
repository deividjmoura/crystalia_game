# Netlify conectado ao repositório GitHub (Site settings → Build & deploy).
#
# Desde 2026-09-23 o site oficial é o WEBAPP (webapp/): landing + menu +
# canvas do jogo falando WebSocket direto com o servidor autoritativo.
# O export Godot (web/) continua no repo como legado/vitrine, mas não é
# mais o que a Netlify publica por padrão.
#
# Observação: o MESMO webapp também é servido pelo próprio servidor
# autoritativo (server/src/index.js entrega webapp/ na raiz) — ou seja,
# um único deploy na Render já traz jogo + WebSocket same-origin.

[build]
  publish = "webapp"
  command = ""

# Cache policy: NUNCA "immutable" — nomes de arquivo fixos sem hash.
# Revalidar sempre; 304 via ETag quando nada muda (bug real de 2026-09-15:
# cache eterno prendendo o browser numa versão velha).

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
