# Usado quando a Netlify é conectada direto no repositório GitHub
# (Site settings → Build & deploy): a raiz publicada é a pasta web/,
# que contém o build já exportado do Godot (não há passo de build em JS).

[build]
  publish = "web"
  command = ""

# Cache policy: NUNCA "immutable" aqui — os nomes de arquivo do export Godot
# (index.wasm/pck/js) não mudam entre builds, então um cache eterno trava o
# browser do jogador numa versão velha do jogo (bug real de 2026-09-15: site
# deployado servindo perfeitamente e o Chrome continuava mostrando quadrados).
# Estratégia: revalidar SEMPRE; a Netlify responde 304 com ETag quando o
# conteúdo não mudou — zero custo de banda no resto do tempo.

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.pck"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
